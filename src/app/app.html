<div class="counter-card">
  <h2>Counter App</h2>
  <div class="display">
    {{ counter() }}
  </div>
  <div class="actions">
    <button class="btn btn-decrement" (click)="decrement()">-</button>
    <button class="btn btn-reset" (click)="reset()">Reset</button>
    <button class="btn btn-increment" (click)="increment()">+</button>
  </div>
</div>
